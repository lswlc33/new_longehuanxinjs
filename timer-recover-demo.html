<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>移动端后台恢复触发 Demo</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --muted: #94a3b8;
            --text: #e5e7eb;
            --ok: #22c55e;
            --warn: #f59e0b;
            --err: #ef4444;
            --pri: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #020617 0%, #0b1220 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 14px;
        }

        .wrap {
            max-width: 780px;
            margin: 0 auto;
            display: grid;
            gap: 12px;
        }

        .card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 14px;
            padding: 12px;
            backdrop-filter: blur(3px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .muted {
            color: var(--muted);
            font-size: 12px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input,
        button,
        select {
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, .35);
            background: #0b1220;
            color: var(--text);
            padding: 9px 10px;
            font-size: 14px;
        }

        input {
            flex: 1;
            min-width: 180px;
        }

        button {
            cursor: pointer;
            border-color: rgba(56, 189, 248, .4);
            background: #082f49;
        }

        button.secondary {
            background: #1f2937;
            border-color: rgba(148, 163, 184, .35);
        }

        button.warn {
            background: #3f2d08;
            border-color: rgba(245, 158, 11, .45);
        }

        button.err {
            background: #3f0d16;
            border-color: rgba(239, 68, 68, .45);
        }

        .status {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .chip {
            border: 1px solid rgba(148, 163, 184, .35);
            border-radius: 999px;
            padding: 5px 10px;
            background: #111827;
        }

        .chip.ok {
            border-color: rgba(34, 197, 94, .45);
            color: #86efac;
        }

        .chip.warn {
            border-color: rgba(245, 158, 11, .45);
            color: #fcd34d;
        }

        .logs {
            background: #020617;
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 10px;
            height: 300px;
            overflow: auto;
            padding: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
        }

        .good {
            color: #86efac;
        }

        .bad {
            color: #fca5a5;
        }

        .tips li {
            margin: 6px 0;
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <h1>移动端后台恢复触发 Demo</h1>
            <div class="muted">目标：验证页面切后台后，恢复到前台时通过触发器补跑任务并重启轮询。</div>
        </div>

        <div class="card">
            <div class="row">
                <input id="webhookUrl" placeholder="Webhook URL（可留空，仅记录本地日志）" />
                <input id="orderId" placeholder="订单号（如 TEST-1001）" />
            </div>
            <div class="row" style="margin-top:8px;">
                <select id="pollMs">
                    <option value="3000">轮询间隔 3 秒</option>
                    <option value="5000" selected>轮询间隔 5 秒</option>
                    <option value="10000">轮询间隔 10 秒</option>
                </select>
                <button id="btnStart">启动轮询</button>
                <button id="btnStop" class="secondary">停止轮询</button>
                <button id="btnCheckNow" class="warn">立即检查一次</button>
                <button id="btnReset" class="err">清空去重记录</button>
            </div>
            <div class="small" style="margin-top:8px;">去重键：<code>demo:notified:{orderId}:PAID</code>，避免重复推送。</div>
        </div>

        <div class="card">
            <div class="status">
                <span id="sRunning" class="chip warn">轮询: 停止</span>
                <span id="sChecking" class="chip">检查中: 否</span>
                <span id="sLast" class="chip">最后检查: -</span>
                <span id="sVisible" class="chip">页面可见: -</span>
                <span id="sOnline" class="chip">网络: -</span>
            </div>
        </div>

        <div class="card">
            <div style="margin-bottom:6px;">日志</div>
            <div id="logs" class="logs"></div>
        </div>

        <div class="card">
            <div class="small">手机测试步骤：</div>
            <ol class="tips">
                <li>填写订单号，点“启动轮询”。</li>
                <li>切到后台 20~40 秒，再回到浏览器页面。</li>
                <li>观察日志里是否出现 <code>visibilitychange/pageshow/focus</code> 触发，并立即补跑检查。</li>
                <li>如果配置了 Webhook，会在“模拟订单支付完成”后转发一次；同一订单不会重复推送。</li>
            </ol>
        </div>
    </div>

    <script>
        const KEY_LAST_CHECK = 'demo:lastCheckAt';
        const KEY_WEBHOOK = 'demo:webhookUrl';
        const KEY_ORDER = 'demo:orderId';

        let timer = null;
        let checking = false;
        let running = false;

        // 模拟：第 N 次检查后订单变为已支付
        let checkCount = 0;
        const SIMULATE_PAID_AFTER = 4;

        const $ = (id) => document.getElementById(id);
        const els = {
            webhookUrl: $('webhookUrl'),
            orderId: $('orderId'),
            pollMs: $('pollMs'),
            logs: $('logs'),
            sRunning: $('sRunning'),
            sChecking: $('sChecking'),
            sLast: $('sLast'),
            sVisible: $('sVisible'),
            sOnline: $('sOnline'),
            btnStart: $('btnStart'),
            btnStop: $('btnStop'),
            btnCheckNow: $('btnCheckNow'),
            btnReset: $('btnReset')
        };

        function now() {
            return new Date().toLocaleTimeString();
        }

        function log(msg, type = 'info') {
            const color =
                type === 'ok' ? 'good' :
                    type === 'err' ? 'bad' : '';
            const line = `[${now()}] ${msg}`;
            const div = document.createElement('div');
            if (color) div.className = color;
            div.textContent = line;
            els.logs.appendChild(div);
            els.logs.scrollTop = els.logs.scrollHeight;
            console.log(line);
        }

        function setChip(el, text, tone = 'normal') {
            el.textContent = text;
            el.className = 'chip' + (tone === 'ok' ? ' ok' : tone === 'warn' ? ' warn' : '');
        }

        function notifiedKey(orderId) {
            return `demo:notified:${orderId}:PAID`;
        }

        function isNotified(orderId) {
            return localStorage.getItem(notifiedKey(orderId)) === '1';
        }

        function markNotified(orderId) {
            localStorage.setItem(notifiedKey(orderId), '1');
        }

        function saveBaseInputs() {
            localStorage.setItem(KEY_WEBHOOK, els.webhookUrl.value.trim());
            localStorage.setItem(KEY_ORDER, els.orderId.value.trim());
        }

        function loadBaseInputs() {
            els.webhookUrl.value = localStorage.getItem(KEY_WEBHOOK) || '';
            els.orderId.value = localStorage.getItem(KEY_ORDER) || 'TEST-1001';
        }

        function updateRuntimeStatus() {
            setChip(els.sVisible, `页面可见: ${document.visibilityState}`, document.visibilityState === 'visible' ? 'ok' : 'warn');
            setChip(els.sOnline, `网络: ${navigator.onLine ? 'online' : 'offline'}`, navigator.onLine ? 'ok' : 'warn');
            const last = localStorage.getItem(KEY_LAST_CHECK);
            setChip(els.sLast, `最后检查: ${last ? new Date(Number(last)).toLocaleTimeString() : '-'}`);
            setChip(els.sRunning, `轮询: ${running ? '运行中' : '停止'}`, running ? 'ok' : 'warn');
            setChip(els.sChecking, `检查中: ${checking ? '是' : '否'}`, checking ? 'warn' : 'ok');
        }

        function startPolling(reason = 'manual') {
            stopPolling('restart');
            const ms = Number(els.pollMs.value || 5000);
            running = true;
            timer = setInterval(() => safeCheck(`interval/${ms}ms`), ms);
            log(`启动轮询，间隔=${ms}ms，reason=${reason}`, 'ok');
            updateRuntimeStatus();
        }

        function stopPolling(reason = 'manual') {
            if (timer) clearInterval(timer);
            timer = null;
            running = false;
            log(`停止轮询，reason=${reason}`);
            updateRuntimeStatus();
        }

        // 模拟订单查询接口：前几次未支付，达到阈值后变已支付
        async function fakeGetOrderStatus(orderId) {
            await sleep(300);
            checkCount += 1;
            const paid = checkCount >= SIMULATE_PAID_AFTER;
            return {
                orderId,
                payState: paid ? 2 : 0,
                payStateText: paid ? '已付款' : '待付款',
                checkCount
            };
        }

        async function forwardWebhook(payload) {
            const url = els.webhookUrl.value.trim();
            if (!url) {
                log('未填写Webhook URL，跳过转发（仅本地演示）', 'warn');
                return { skipped: true };
            }

            // no-cors 适合演示：可发出请求但无法读取响应体
            await fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return { sent: true };
        }

        async function checkNow(reason = 'manual') {
            const orderId = (els.orderId.value || '').trim();
            if (!orderId) {
                log('订单号为空，跳过检查', 'err');
                return;
            }

            if (checking) {
                log(`已有检查在进行中，忽略本次触发，reason=${reason}`, 'warn');
                return;
            }

            checking = true;
            updateRuntimeStatus();

            try {
                const status = await fakeGetOrderStatus(orderId);
                localStorage.setItem(KEY_LAST_CHECK, String(Date.now()));
                log(`检查完成 #${status.checkCount}，order=${orderId}，state=${status.payStateText}，reason=${reason}`);

                if (status.payState === 2) {
                    if (isNotified(orderId)) {
                        log(`订单已推送过，跳过重复推送，order=${orderId}`, 'warn');
                    } else {
                        const payload = {
                            event: 'order_paid',
                            orderId,
                            source: 'frontend-demo',
                            timestamp: Date.now()
                        };
                        await forwardWebhook(payload);
                        markNotified(orderId);
                        log(`已执行Webhook转发并标记去重，order=${orderId}`, 'ok');
                    }
                }
            } catch (e) {
                log(`检查异常: ${e.message || e}`, 'err');
            } finally {
                checking = false;
                updateRuntimeStatus();
            }
        }

        async function safeCheck(reason) {
            await checkNow(reason);
        }

        function resumeAndRecover(reason) {
            log(`触发恢复补偿: ${reason}`, 'ok');
            safeCheck(`recover/${reason}`);
            startPolling(`recover/${reason}`);
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function bindEvents() {
            els.btnStart.addEventListener('click', () => {
                saveBaseInputs();
                startPolling('btnStart');
            });
            els.btnStop.addEventListener('click', () => stopPolling('btnStop'));
            els.btnCheckNow.addEventListener('click', () => {
                saveBaseInputs();
                safeCheck('btnCheckNow');
            });
            els.btnReset.addEventListener('click', () => {
                const orderId = (els.orderId.value || '').trim();
                if (orderId) {
                    localStorage.removeItem(notifiedKey(orderId));
                }
                checkCount = 0;
                localStorage.removeItem(KEY_LAST_CHECK);
                log('已清空当前订单去重记录和检查计数', 'ok');
                updateRuntimeStatus();
            });

            els.webhookUrl.addEventListener('change', saveBaseInputs);
            els.orderId.addEventListener('change', saveBaseInputs);

            document.addEventListener('visibilitychange', () => {
                log(`事件: visibilitychange -> ${document.visibilityState}`);
                updateRuntimeStatus();
                if (document.visibilityState === 'visible') resumeAndRecover('visibilitychange');
            });

            window.addEventListener('pageshow', () => {
                log('事件: pageshow');
                updateRuntimeStatus();
                resumeAndRecover('pageshow');
            });

            window.addEventListener('focus', () => {
                log('事件: focus');
                updateRuntimeStatus();
                resumeAndRecover('focus');
            });

            window.addEventListener('online', () => {
                log('事件: online');
                updateRuntimeStatus();
                resumeAndRecover('online');
            });

            window.addEventListener('offline', () => {
                log('事件: offline', 'warn');
                updateRuntimeStatus();
            });

            window.addEventListener('beforeunload', () => stopPolling('beforeunload'));
        }

        function boot() {
            loadBaseInputs();
            bindEvents();
            updateRuntimeStatus();
            log('Demo 已启动');
            resumeAndRecover('boot');
        }

        boot();
    </script>
</body>

</html>
